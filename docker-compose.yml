services:
  home-integrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-integrator
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Código Python - desenvolvimento
      - ./app:/app/app
      # SQLite persistente
      - ./data:/data
    network_mode: host
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
